<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Detekcja emocji - demo</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Rozpoznawanie emocji na twarzy</h1>
    <p class="subtitle">FER2013 CNN + MediaPipe BlazeFace &mdash; zdjecia, filmy, kamera w czasie rzeczywistym</p>
  </header>

  <section class="controls">
    <div class="row">
      <label for="detectorSelect"><strong>Detektor twarzy:</strong></label>
      <select id="detectorSelect"></select>
      <span class="detector-desc" id="detectorDesc"></span>
    </div>
    <div class="row">
      <label class="checkbox">
        <input type="checkbox" id="compareMode">
        <span>Tryb por&oacute;wnania detektor&oacute;w (3 modele obok siebie)</span>
      </label>
    </div>
  </section>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="image">Zdjecie</button>
    <button class="tab-btn" data-tab="video">Film</button>
    <button class="tab-btn" data-tab="camera">Kamera (live)</button>
  </nav>

  <!-- ZDJECIE -->
  <section class="tab-panel active" id="tab-image">
    <div class="upload-box">
      <input type="file" id="imageFile" accept="image/*">
      <button id="imageGo" class="primary">Przetwarzaj</button>
    </div>
    <div class="status" id="imageStatus"></div>
    <div class="result-grid" id="imageResults"></div>
  </section>

  <!-- FILM -->
  <section class="tab-panel" id="tab-video">
    <div class="upload-box">
      <input type="file" id="videoFile" accept="video/*">
      <button id="videoGo" class="primary">Przetwarzaj film</button>
    </div>
    <p class="hint">Tryb por&oacute;wnania nie jest dostepny dla filmu (zbyt wolne) &mdash; uzywany jest wybrany detektor.</p>
    <div class="status" id="videoStatus"></div>
    <progress id="videoProgress" max="100" value="0" style="display:none; width:100%;"></progress>
    <div class="video-result" id="videoResult"></div>
  </section>

  <!-- KAMERA -->
  <section class="tab-panel" id="tab-camera">
    <div class="controls">
      <button id="camStart" class="primary">Wlacz kamere</button>
      <button id="camStop" disabled>Zatrzymaj</button>
      <label class="checkbox">
        <input type="checkbox" id="camMirror" checked>
        <span>Lustrzane odbicie podgladu</span>
      </label>
      <span class="stat" id="camFps"></span>
    </div>
    <video id="camVideo" autoplay playsinline muted style="display:none"></video>
    <canvas id="camCapture" style="display:none"></canvas>
    <div class="result-grid" id="camResults"></div>
  </section>

  <footer>
    <p>Lokalne demo &mdash; model i detektory dzialaja na CPU lub GPU lokalnego komputera.</p>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
